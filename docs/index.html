<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MTR Tendon Analyzer</title>
  <style>
    :root {
      --ink: #17211e;
      --muted: #64706c;
      --paper: #eef0e9;
      --panel: #fffefa;
      --line: #c8cec7;
      --accent: #087e6a;
      --hot: #d22f2f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: Georgia, "Times New Roman", serif; }
    main { min-height: 100vh; display: grid; grid-template-columns: minmax(260px, 330px) minmax(0, 1fr); }
    aside { padding: 24px; background: var(--panel); border-right: 1px solid var(--line); }
    h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: 0; }
    .kicker { margin: 0 0 22px; color: var(--muted); font: 12px Consolas, monospace; text-transform: uppercase; }
    fieldset { margin: 0 0 20px; padding: 0; border: 0; }
    legend { width: 100%; margin-bottom: 9px; padding-bottom: 6px; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 700; }
    label { display: block; margin: 10px 0 5px; font-size: 13px; }
    input[type="file"], input[type="number"], select { width: 100%; font: 11px Consolas, monospace; }
    input[type="number"] { padding: 7px; border: 1px solid var(--line); background: white; }
    .vector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .vector label { margin-top: 4px; }
    .note { color: var(--muted); font: 11px/1.45 Consolas, monospace; }
    .privacy { padding: 10px; border-left: 3px solid var(--accent); background: #edf5f1; }
    #status { min-height: 40px; margin-top: 12px; font-size: 13px; line-height: 1.4; }
    .primary { width: 100%; color: white; background: var(--accent); font-weight: 700; }
    .primary:disabled { color: white; background: var(--muted); }
    progress { width: 100%; height: 5px; margin-top: 10px; accent-color: var(--accent); }
    .downloads { margin-top: 12px; }
    .downloads a { display: block; margin-top: 7px; color: var(--accent); font-size: 12px; }
    [hidden] { display: none !important; }
    .workspace { min-width: 0; min-height: 100vh; display: grid; grid-template-rows: auto minmax(520px, 1fr); background: #090d0c; }
    .toolbar { padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #f7f7f2; border-bottom: 1px solid var(--line); }
    .segmented { display: flex; gap: 2px; padding: 2px; background: #dfe2da; border-radius: 4px; }
    button { border: 0; border-radius: 3px; padding: 8px 10px; color: #4f5b57; background: transparent; font: 11px Consolas, monospace; cursor: pointer; }
    button.active { color: white; background: var(--accent); }
    button:disabled { opacity: .45; cursor: default; }
    .toggle { display: inline-flex; align-items: center; gap: 7px; margin: 0; white-space: nowrap; font: 11px Consolas, monospace; }
    .floor-control { display: inline-flex; align-items: center; gap: 6px; margin: 0; white-space: nowrap; font: 11px Consolas, monospace; }
    #mtr-floor { width: 104px; margin: 0; accent-color: var(--accent); }
    .viewer { position: relative; min-width: 0; min-height: 0; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      .workspace { min-height: 70vh; grid-template-rows: auto 70vh; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .segmented { overflow-x: auto; }
      button { flex: 1 0 auto; }
    }
  </style>
</head>
<body>
  <main>
    <aside>
      <h1>MTR tendon analyzer</h1>
      <p class="kicker">private browser analysis</p>
      <p class="note privacy">Analysis runs in this browser tab. Files never leave this device.</p>
      <fieldset>
        <legend>Analysis inputs</legend>
        <label for="mtr">MTR image</label>
        <input id="mtr" type="file" accept=".nii,.nii.gz">
        <label for="segmentations">Tendon segmentations</label>
        <input id="segmentations" type="file" accept=".nii,.nii.gz" multiple>
        <label>B0 vector in image axes</label>
        <div class="vector">
          <label for="b0i">i<input id="b0i" type="number" value="0" step="any"></label>
          <label for="b0j">j<input id="b0j" type="number" value="0" step="any"></label>
          <label for="b0k">k<input id="b0k" type="number" value="1" step="any"></label>
        </div>
        <button id="analyze" class="primary" type="button" disabled>Extract magic-angle maps</button>
        <progress id="analysis-progress" hidden></progress>
        <div id="downloads" class="downloads"></div>
      </fieldset>
      <fieldset>
        <legend>Generated or precomputed outputs</legend>
        <label for="results-folder">Results folder</label>
        <input id="results-folder" type="file" webkitdirectory directory multiple>
        <label for="results-subject">Subject</label>
        <select id="results-subject" disabled>
          <option value="">Choose a results folder first</option>
        </select>
        <label for="labels">Tendon labels</label>
        <input id="labels" type="file" accept=".nii,.nii.gz">
        <label for="angle">Angle to B0</label>
        <input id="angle" type="file" accept=".nii,.nii.gz">
        <label for="deviation">Magic-angle deviation</label>
        <input id="deviation" type="file" accept=".nii,.nii.gz">
        <label for="centerlines">Labeled centerlines</label>
        <input id="centerlines" type="file" accept=".nii,.nii.gz">
      </fieldset>
      <div id="status" role="status">Choose an MTR image and tendon segmentations to begin.</div>
    </aside>
    <section class="workspace">
      <div class="toolbar">
        <div class="segmented" aria-label="Overlay display">
          <button type="button" class="active" data-overlay="labels" disabled>Labels</button>
          <button type="button" data-overlay="angle" disabled>Angle to B0</button>
          <button type="button" data-overlay="deviation" disabled>Magic deviation</button>
        </div>
        <label class="toggle"><input id="mtr-denoise" type="checkbox" checked disabled> MTR background cleanup (2x2x2, 8/8)</label>
        <label class="floor-control" for="mtr-floor">Floor <input id="mtr-floor" type="range" min="0" max="0.15" step="0.01" value="0.05" disabled><output id="mtr-floor-value">0.05</output></label>
        <label class="toggle"><input id="show-mtr-underlay" type="checkbox" checked disabled> MTR underlay</label>
        <label class="toggle"><input id="show-centerlines" type="checkbox" checked disabled> Centerlines</label>
        <div class="segmented" aria-label="Viewer layout">
          <button type="button" class="active" data-view="render">3D</button>
          <button type="button" data-view="ortho3d">Ortho + 3D</button>
        </div>
      </div>
      <section class="viewer"><canvas id="gl"></canvas></section>
    </section>
  </main>
  <script type="module">
    import { Niivue, NVImage } from "https://cdn.jsdelivr.net/npm/@niivue/niivue@0.57.0/+esm";

    const nv = new Niivue({
      backColor: [0.035, 0.05, 0.047, 1],
      show3Dcrosshair: true,
      multiplanarShowRender: 1
    });
    await nv.attachTo("gl");
    nv.addColormap("magicDeviation", {
      R: [210, 210, 246, 35],
      G: [45, 45, 180, 139],
      B: [45, 45, 65, 84],
      A: [0, 255, 255, 255],
      I: [0, 1, 128, 255]
    });
    nv.setSliceType(nv.sliceTypeRender);

    const inputs = Object.fromEntries(
      ["mtr", "labels", "angle", "deviation", "centerlines"].map(id => [id, document.querySelector(`#${id}`)])
    );
    const segmentationInput = document.querySelector("#segmentations");
    const analyzeButton = document.querySelector("#analyze");
    const analysisProgress = document.querySelector("#analysis-progress");
    const downloads = document.querySelector("#downloads");
    const status = document.querySelector("#status");
    const centerlineToggle = document.querySelector("#show-centerlines");
    const mtrDenoiseToggle = document.querySelector("#mtr-denoise");
    const mtrFloorInput = document.querySelector("#mtr-floor");
    const mtrFloorValue = document.querySelector("#mtr-floor-value");
    const mtrUnderlayToggle = document.querySelector("#show-mtr-underlay");
    const resultsFolderInput = document.querySelector("#results-folder");
    const resultsSubjectSelect = document.querySelector("#results-subject");
    let overlayMode = "labels";
    let objectUrls = [];
    let downloadUrls = [];
    let generatedFiles = {};
    let analysisWorker;
    let resultsBySubject = new Map();
    let selectedResultFiles;
    let filteredMtrSource;
    let filteredMtrFile;
    let filteredMtrFloor;

    function selectedMtr() {
      return selectedResultFiles?.mtr || inputs.mtr.files[0];
    }

    function fileUrl(file) {
      const url = URL.createObjectURL(file);
      objectUrls.push(url);
      return url;
    }

    function overlayAvailable(mode) {
      return Boolean(selectedResultFiles?.[mode] || generatedFiles[mode] || inputs[mode].files[0]);
    }

    function selectedVolume(mode) {
      return selectedResultFiles?.[mode] || generatedFiles[mode] || inputs[mode].files[0];
    }

    function updateControls() {
      document.querySelectorAll("[data-overlay]").forEach(button => {
        button.disabled = !overlayAvailable(button.dataset.overlay);
      });
      centerlineToggle.disabled = !selectedVolume("centerlines");
      mtrUnderlayToggle.disabled = !selectedMtr();
      mtrDenoiseToggle.disabled = !selectedMtr() || !mtrUnderlayToggle.checked;
      mtrFloorInput.disabled = !selectedMtr() || !mtrUnderlayToggle.checked;
      analyzeButton.disabled = Boolean(selectedResultFiles) || !inputs.mtr.files[0] || !segmentationInput.files.length || !analysisProgress.hidden;
    }

    function cleanMtrImage(data, dimensions, floor) {
      const worker = new Worker("./mtr-background-worker.js", { type: "module" });
      const copy = data.slice();
      return new Promise((resolve, reject) => {
        worker.onmessage = event => {
          if (event.data.type === "progress") {
            status.textContent = `Removing unsupported MTR background: ${event.data.percent}%`;
          } else if (event.data.type === "complete") {
            worker.terminate();
            resolve(new data.constructor(event.data.buffer));
          } else if (event.data.type === "error") {
            worker.terminate();
            reject(new Error(event.data.message));
          }
        };
        worker.onerror = event => {
          worker.terminate();
          reject(new Error(event.message || "The MTR median filter worker stopped."));
        };
        worker.postMessage({ data: copy, dimensions, floor }, [copy.buffer]);
      });
    }

    async function displayMtrFile(source) {
      if (!mtrDenoiseToggle.checked) return source;
      const floor = Number(mtrFloorInput.value);
      if (filteredMtrSource === source && filteredMtrFloor === floor && filteredMtrFile) return filteredMtrFile;
      status.textContent = "Preparing display-only MTR background cleanup...";
      const image = await NVImage.loadFromFile({ file: source });
      const dimensions = image.hdr.dims.slice(1, 4);
      image.img = await cleanMtrImage(image.img, dimensions, floor);
      const nifti = await image.saveToUint8Array("mtr_display_clean.nii.gz");
      filteredMtrSource = source;
      filteredMtrFloor = floor;
      filteredMtrFile = new File([nifti], "mtr_display_clean.nii.gz", { type: "application/gzip" });
      return filteredMtrFile;
    }

    async function refreshViewer() {
      const sourceMtr = selectedMtr();
      if (!sourceMtr) {
        status.textContent = "Choose an MTR image to begin.";
        return;
      }
      let mtr;
      if (mtrUnderlayToggle.checked) {
        try {
          mtr = await displayMtrFile(sourceMtr);
        } catch (error) {
          status.textContent = error.message || "Could not clean the MTR display.";
          return;
        }
      }
      objectUrls.forEach(URL.revokeObjectURL);
      objectUrls = [];
      const volumes = [];
      if (mtr) volumes.push({ url: fileUrl(mtr), name: mtr.name, colormap: "gray" });
      const overlay = selectedVolume(overlayMode);
      if (overlay) {
        const settings = {
          labels: { colormap: "turbo", opacity: 0.75, cal_min: 0, cal_max: 12 },
          angle: { colormap: "turbo", opacity: 0.8, cal_min: 0, cal_max: 90 },
          deviation: { colormap: "magicDeviation", opacity: 0.85, cal_min: -1, cal_max: 54.7356 }
        }[overlayMode];
        volumes.push({ url: fileUrl(overlay), name: overlay.name, ...settings });
      }
      const centerlines = selectedVolume("centerlines");
      if (centerlines && centerlineToggle.checked) {
        volumes.push({ url: fileUrl(centerlines), name: centerlines.name, colormap: "turbo", opacity: 1, cal_min: 0, cal_max: 12 });
      }
      if (!volumes.length) {
        status.textContent = "No image overlays are selected.";
        return;
      }
      try {
        status.textContent = "Loading local volumes...";
        await nv.loadVolumes(volumes);
        status.textContent = `${volumes.length} local volume${volumes.length === 1 ? "" : "s"} displayed. Nothing was uploaded.`;
      } catch (error) {
        status.textContent = error.message || "Could not load the selected volumes.";
      }
    }

    Object.values(inputs).forEach(input => input.addEventListener("change", async () => {
      selectedResultFiles = undefined;
      resultsSubjectSelect.value = "";
      if (input.id !== "mtr") delete generatedFiles[input.id];
      updateControls();
      if (input.id !== "mtr" && input.id !== "centerlines") {
        overlayMode = input.id;
        document.querySelectorAll("[data-overlay]").forEach(button => {
          button.classList.toggle("active", button.dataset.overlay === overlayMode);
        });
      }
      await refreshViewer();
    }));

    resultsFolderInput.addEventListener("change", () => {
      const filesBySubject = new Map();
      const modesByFilename = new Map([
        ["mtr_reference.nii.gz", "mtr"],
        ["combined_tendon_labels.nii.gz", "labels"],
        ["combined_tendon_angle_degrees.nii.gz", "angle"],
        ["combined_magic_angle_deviation_degrees.nii.gz", "deviation"],
        ["combined_tendon_centerlines.nii.gz", "centerlines"]
      ]);
      for (const file of resultsFolderInput.files) {
        const path = file.webkitRelativePath || file.name;
        const match = path.match(/(?:^|\/)(Proband_\d+)\/([^/]+)$/i);
        const mode = modesByFilename.get(match?.[2].toLowerCase());
        if (!match || !mode) continue;
        const subject = match[1].toUpperCase();
        if (!filesBySubject.has(subject)) filesBySubject.set(subject, {});
        filesBySubject.get(subject)[mode] = file;
      }
      resultsBySubject = new Map(
        [...filesBySubject].filter(([, files]) => Object.keys(files).length === 5)
      );
      resultsSubjectSelect.replaceChildren(new Option("Choose a subject", ""));
      for (const subject of [...resultsBySubject.keys()].sort()) {
        resultsSubjectSelect.add(new Option(subject.replace("PROBAND_", "Proband "), subject));
      }
      resultsSubjectSelect.disabled = resultsBySubject.size === 0;
      selectedResultFiles = undefined;
      if (resultsBySubject.size) {
        status.textContent = `${resultsBySubject.size} subjects ready. Choose a subject to load its MTR and maps.`;
      } else {
        status.textContent = "No complete Proband result folders found. Choose the extracted proband_04-30_magic_angle folder.";
      }
    });

    resultsSubjectSelect.addEventListener("change", async () => {
      selectedResultFiles = resultsBySubject.get(resultsSubjectSelect.value);
      if (!selectedResultFiles) return;
      updateControls();
      await refreshViewer();
    });

    segmentationInput.addEventListener("change", updateControls);
    mtrDenoiseToggle.addEventListener("change", refreshViewer);
    mtrUnderlayToggle.addEventListener("change", () => {
      updateControls();
      refreshViewer();
    });
    mtrFloorInput.addEventListener("input", () => {
      mtrFloorValue.value = Number(mtrFloorInput.value).toFixed(2);
    });
    mtrFloorInput.addEventListener("change", () => {
      if (mtrDenoiseToggle.checked) refreshViewer();
    });

    function getAnalysisWorker() {
      if (analysisWorker) return analysisWorker;
      analysisWorker = new Worker("./analysis-worker.js", { type: "module" });
      return analysisWorker;
    }

    function runAnalysis(payload, transfers) {
      const worker = getAnalysisWorker();
      return new Promise((resolve, reject) => {
        worker.onmessage = event => {
          if (event.data.type === "progress") status.textContent = event.data.message;
          if (event.data.type === "complete") resolve(event.data);
          if (event.data.type === "error") reject(new Error(event.data.message));
        };
        worker.onerror = event => reject(new Error(event.message || "The browser analysis worker stopped."));
        worker.postMessage(payload, transfers);
      });
    }

    function showDownloads(files) {
      downloadUrls.forEach(URL.revokeObjectURL);
      downloadUrls = [];
      downloads.replaceChildren(...files.map(file => {
        const url = URL.createObjectURL(file);
        downloadUrls.push(url);
        const link = document.createElement("a");
        link.href = url;
        link.download = file.name;
        link.textContent = `Download ${file.name}`;
        return link;
      }));
    }

    analyzeButton.addEventListener("click", async () => {
      const referenceFile = inputs.mtr.files[0];
      const segmentationFiles = [...segmentationInput.files];
      const b0 = ["b0i", "b0j", "b0k"].map(id => Number(document.querySelector(`#${id}`).value));
      if (!referenceFile || !segmentationFiles.length) return;
      if (!b0.every(Number.isFinite) || Math.hypot(...b0) === 0) {
        status.textContent = "B0 must be a finite, non-zero vector.";
        return;
      }

      analysisProgress.hidden = false;
      updateControls();
      downloads.replaceChildren();
      try {
        status.textContent = "Reading local NIfTI files...";
        const reference = { name: referenceFile.name, buffer: await referenceFile.arrayBuffer() };
        const segmentations = await Promise.all(segmentationFiles.map(async file => ({
          name: file.name,
          buffer: await file.arrayBuffer()
        })));
        const result = await runAnalysis(
          { type: "analyze", reference, segmentations, b0 },
          [reference.buffer, ...segmentations.map(segmentation => segmentation.buffer)]
        );
        const files = result.files.map(output => new File(
          [output.buffer],
          output.name,
          { type: output.name.endsWith(".csv") ? "text/csv" : "application/gzip" }
        ));
        const byName = Object.fromEntries(files.map(file => [file.name, file]));
        generatedFiles = {
          labels: byName["combined_tendon_labels.nii.gz"],
          angle: byName["combined_tendon_angle_degrees.nii.gz"],
          deviation: byName["combined_magic_angle_deviation_degrees.nii.gz"],
          centerlines: byName["combined_tendon_centerlines.nii.gz"]
        };
        showDownloads(files);
        overlayMode = "deviation";
        document.querySelectorAll("[data-overlay]").forEach(button => {
          button.classList.toggle("active", button.dataset.overlay === overlayMode);
        });
        updateControls();
        await refreshViewer();
        status.textContent = `${result.summary.tendon_count} tendon${result.summary.tendon_count === 1 ? "" : "s"} analyzed locally. Six output files are ready.`;
      } catch (error) {
        analysisWorker?.terminate();
        analysisWorker = undefined;
        status.textContent = error.message || "Analysis failed.";
      } finally {
        analysisProgress.hidden = true;
        updateControls();
      }
    });

    document.querySelectorAll("[data-overlay]").forEach(button => button.addEventListener("click", async () => {
      overlayMode = button.dataset.overlay;
      document.querySelectorAll("[data-overlay]").forEach(item => item.classList.toggle("active", item === button));
      await refreshViewer();
    }));

    centerlineToggle.addEventListener("change", refreshViewer);
    document.querySelectorAll("[data-view]").forEach(button => button.addEventListener("click", () => {
      document.querySelectorAll("[data-view]").forEach(item => item.classList.toggle("active", item === button));
      nv.setSliceType(button.dataset.view === "render" ? nv.sliceTypeRender : nv.sliceTypeMultiplanar);
    }));

    updateControls();
    window.addEventListener("beforeunload", () => {
      objectUrls.forEach(URL.revokeObjectURL);
      downloadUrls.forEach(URL.revokeObjectURL);
      analysisWorker?.terminate();
    });
  </script>
</body>
</html>
